<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#cyanGrad)" />

  <!-- Supertag -->
  <text x="80" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#0891b2">
    FACHPORTAL &amp; ARCHIV · IFPI-KLASSIFIKATION · EBU R128
  </text>

  <!-- Main Headline -->
  <text x="80" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" letter-spacing="-3" fill="#0f172a">
    Elektropop
  </text>
  <text x="560" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" letter-spacing="-3" fill="#0891b2">
    .de
  </text>

  <!-- Subtitle -->
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#64748b">
    Synthesizer-Architektur, BPM-Klassifikation &amp; Künstler-Datenbank
  </text>

  <!-- Key Metrics Box -->
  <g transform="translate(80, 360)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="230" height="150" fill="#f8fafc" stroke="#e2e8f0" rx="4" />
    <text x="24" y="55" font-family="ui-monospace, monospace" font-size="44" font-weight="900" fill="#0f172a">133</text>
    <text x="24" y="90" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b">BPM REFERENZ</text>
    <text x="24" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Blue Monday (1983)</text>

    <!-- Box 2 -->
    <rect x="260" y="0" width="230" height="150" fill="#f8fafc" stroke="#e2e8f0" rx="4" />
    <text x="284" y="55" font-family="ui-monospace, monospace" font-size="44" font-weight="900" fill="#0f172a">–14</text>
    <text x="284" y="90" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b">LUFS NORM</text>
    <text x="284" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">EBU R128 Streaming</text>

    <!-- Box 3 -->
    <rect x="520" y="0" width="230" height="150" fill="#f8fafc" stroke="#e2e8f0" rx="4" />
    <text x="544" y="55" font-family="ui-monospace, monospace" font-size="44" font-weight="900" fill="#0f172a">1977</text>
    <text x="544" y="90" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b">URSPRUNG</text>
    <text x="544" y="112" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Krautrock zu Synth-Pop</text>

    <!-- Box 4 (Tool CTA) -->
    <rect x="780" y="0" width="260" height="150" fill="#0891b2" rx="4" />
    <text x="804" y="55" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff">🎛️ Rechner-Tool</text>
    <text x="804" y="90" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#e0f2fe">BPM &amp; Skalen-Finder</text>
    <text x="804" y="115" font-family="ui-monospace, monospace" font-size="12" fill="#cffafe">/rechner-embed</text>
  </g>

  <!-- Footer Info -->
  <text x="80" y="580" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">
    https://elektropop.de · Zero-CDN · DSGVO-konform · Stand: September 2026
  </text>
</svg>
